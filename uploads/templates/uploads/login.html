{% extends "uploads/base.html" %}

{% block title %}

Login

{% endblock %}

{% block content %}

<div class="auth-container">


<h1>
    Login
</h1>

{% if form.errors %}

    <div class="error-message">
        Invalid username or password.
    </div>

{% endif %}

<form
    method="post"
    class="auth-form"
>

    {% csrf_token %}

    <div class="form-group">

        <label>
            Username
        </label>

        {{ form.username }}

    </div>

    <div class="form-group">

        <label>
            Password
        </label>

        {{ form.password }}

    </div>

    <button
        type="submit"
        class="button"
    >
        Login
    </button>

    <input
        type="hidden"
        name="next"
        value="{{ next }}"
    >

</form>

<p>
    Don't have an account?

    <a href="{% url 'register' %}">
        Register
    </a>
</p>


</div>

{% endblock %}
