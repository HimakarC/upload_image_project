{% extends "uploads/base.html" %}


{% block title %}

Register

{% endblock %}


{% block content %}


<div class="auth-container">


    <h1>

        Create Account

    </h1>


    {% if error %}

        <div class="error-message">

            {{ error }}

        </div>

    {% endif %}


    <form
        method="post"
        class="auth-form"
    >


        {% csrf_token %}


        <div class="form-group">

            <label>

                Username

            </label>

            <input
                type="text"
                name="username"
                required
            >

        </div>


        <div class="form-group">

            <label>

                Email

            </label>

            <input
                type="email"
                name="email"
            >

        </div>


        <div class="form-group">

            <label>

                Password

            </label>

            <input
                type="password"
                name="password"
                required
            >

        </div>


        <div class="form-group">

            <label>

                Confirm Password

            </label>

            <input
                type="password"
                name="confirm_password"
                required
            >

        </div>


        <button
            type="submit"
            class="button"
        >

            Register

        </button>


    </form>


    <p>

        Already have an account?


        <a href="{% url 'login' %}">

            Login

        </a>


    </p>


</div>


{% endblock %}
