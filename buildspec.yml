version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - mkdir -p package
      - pip install --upgrade pip
      - pip install -r requirements.txt -t package/

  build:
    commands:
      - cp -r upload_image_project package/
      - cp -r uploads package/
      - cp manage.py package/
      - cp lambda_function.py package/

      # Create ZIP from INSIDE package directory
      - cd package
      - zip -r ../django_lambda.zip .
      - cd ..

  post_build:
    commands:
      - aws lambda update-function-code --function-name django-upload-app --zip-file fileb://django_lambda.zip

artifacts:
  files:
    - django_lambda.zip